name: Build e Publicacao Automatica de Release

on:
  push:
    tags:
      - 'v*'  # O processo SÓ roda quando uma tag iniciando com 'v' for enviada

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Criar diretório de ícones
        run: mkdir -p icons

      - name: Converter Ícone para Windows (.ico)
        if: matrix.os == 'windows-latest'
        run: |
          pip install pillow
          python -c "from PIL import Image; img = Image.open('logo.png'); img.save('icons/icon.ico', format='ICO', sizes=[(256, 256), (128, 128), (64, 64), (48, 48), (32, 32), (16, 16)])"

      - name: Converter Ícone para Linux (.png)
        if: matrix.os == 'ubuntu-latest'
        run: |
          pip install pillow
          python -c "from PIL import Image; img = Image.open('logo.png'); img.resize((256, 256)).save('icons/icon_linux.png')"

      - name: Converter Ícone para macOS (.icns)
        if: matrix.os == 'macos-latest'
        run: |
          pip install icnsutil pillow
          mkdir icon.iconset
          python -c "from PIL import Image; img = Image.open('logo.png'); [img.resize((s, s)).save(f'icon.iconset/icon_{s}x{s}.png') for s in [16, 32, 128, 256, 512]]"
          python -m icnsutil compose icons/icon.icns icon.iconset
          rm -rf icon.iconset

      - name: Instalar Dependências do Sistema (Linux / PortAudio)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev python3-pyaudio

      - name: Instalar Dependências do App
        run: |
          python -m pip install --upgrade pip
          pip install python-docx pypdf google-genai pyinstaller SpeechRecognition pyaudio

      - name: Compilar no Windows
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller --noconsole --onefile --add-data "bncc_data.json;." --name "ProfAula-Windows" --icon "icons/icon.ico" profaula.py

      - name: Compilar no Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          pyinstaller --noconsole --onefile --add-data "bncc_data.json:." --name "ProfAula-Linux" --icon "icons/icon_linux.png" profaula.py

      - name: Compilar no macOS
        if: matrix.os == 'macos-latest'
        run: |
          pyinstaller --noconsole --onefile --add-data "bncc_data.json:." --name "ProfAula-macOS" --icon "icons/icon.icns" profaula.py
          cd dist
          zip -r ProfAula-macOS.zip "ProfAula-macOS.app" "ProfAula-macOS"

      - name: Publicar Executável na Aba Releases
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/ProfAula-Windows.exe
            dist/ProfAula-Linux
            dist/ProfAula-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
