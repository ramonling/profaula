name: Build EduPlan AI Beta

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install python-docx pypdf google-genai pyinstaller

      - name: Compilar no Windows
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller --noconsole --onefile --add-data "bncc_data.json;." --name "EduPlanAI" eduplan.py

      - name: Compilar no Linux e macOS
        if: matrix.os != 'windows-latest'
        run: |
          pyinstaller --noconsole --onefile --add-data "bncc_data.json:." --name "EduPlanAI" eduplan.py

      - name: Salvar Executável como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: EduPlanAI-${{ matrix.os }}
          path: dist/EduPlanAI*