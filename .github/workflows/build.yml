name: Build EduPlan AI com Icones

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Criar diretório de ícones
        run: mkdir -p icons

      - name: Converter Ícone para Windows (.ico)
        if: matrix.os == 'windows-latest'
        run: |
          pip install pillow
          python -c "from PIL import Image; img = Image.open('logo.png'); img.save('icons/icon.ico', format='ICO', sizes=[(256, 256), (128, 128), (64, 64), (48, 48), (32, 32), (16, 16)])"

      - name: Instalar ImageMagick (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Converter Ícone para Linux (.png)
        if: matrix.os == 'ubuntu-latest'
        run: |
          magick convert logo.png -resize 256x256 icons/icon_linux.png

      - name: Converter Ícone para macOS (.icns)
        if: matrix.os == 'macos-latest'
        run: |
          pip install icnsutil pillow
          mkdir icon.iconset
          python -c "from PIL import Image; img = Image.open('logo.png'); [img.resize((s, s)).save(f'icon.iconset/icon_{s}x{s}.png') for s in [16, 32, 128, 256, 512]]"
          python -m icnsutil compose icons/icon.icns icon.iconset
          rm -rf icon.iconset

      - name: Instalar Dependências do App
        run: |
          python -m pip install --upgrade pip
          pip install python-docx pypdf google-genai pyinstaller

      - name: Compilar no Windows
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller --noconsole --onefile --add-data "bncc_data.json;." --name "EduPlanAI" --icon "icons/icon.ico" eduplan.py

      - name: Compilar no Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          pyinstaller --noconsole --onefile --add-data "bncc_data.json:." --name "EduPlanAI" --icon "icons/icon_linux.png" eduplan.py

      - name: Compilar no macOS
        if: matrix.os == 'macos-latest'
        run: |
          pyinstaller --noconsole --onefile --add-data "bncc_data.json:." --name "EduPlanAI" --icon "icons/icon.icns" eduplan.py

      - name: Salvar Executável como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: EduPlanAI-${{ matrix.os }}
          path: dist/EduPlanAI*
